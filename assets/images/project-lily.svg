<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="lilyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B221E"/>
      <stop offset="100%" stop-color="#28322B"/>
    </linearGradient>
    <radialGradient id="lilyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DCD2E9" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#A3B18A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1B221E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="480" fill="url(#lilyBg)"/>

  <!-- Glowing Aura -->
  <circle cx="340" cy="240" r="180" fill="url(#lilyGlow)"/>

  <!-- Aesthetic Geometric Lily Blossom -->
  <g transform="translate(340, 240)">
    <!-- Lily Petals (Layer 1 - back) -->
    <path d="M 0 0 C -40 -100, -80 -140, 0 -200 C 80 -140, 40 -100, 0 0 Z" fill="#DCD2E9" fill-opacity="0.25" stroke="#FAF9F6" stroke-width="1.5"/>
    <path d="M 0 0 C -120 -60, -180 -80, -190 10 C -140 60, -80 30, 0 0 Z" fill="#DCD2E9" fill-opacity="0.3" stroke="#FAF9F6" stroke-width="1.5"/>
    <path d="M 0 0 C 120 -60, 180 -80, 190 10 C 140 60, 80 30, 0 0 Z" fill="#DCD2E9" fill-opacity="0.3" stroke="#FAF9F6" stroke-width="1.5"/>

    <!-- Lily Petals (Layer 2 - front glowing) -->
    <path d="M 0 0 C -80 -30, -120 40, -90 110 C -40 90, -20 50, 0 0 Z" fill="#A3B18A" fill-opacity="0.35" stroke="#A3B18A" stroke-width="2"/>
    <path d="M 0 0 C 80 -30, 120 40, 90 110 C 40 90, 20 50, 0 0 Z" fill="#A3B18A" fill-opacity="0.35" stroke="#A3B18A" stroke-width="2"/>
    <path d="M 0 0 C -30 60, -20 120, 0 160 C 20 120, 30 60, 0 0 Z" fill="#FAF9F6" fill-opacity="0.4" stroke="#FAF9F6" stroke-width="2"/>

    <!-- Flower Center Stamen with Pistil Sparkles -->
    <circle cx="0" cy="0" r="14" fill="#FAF9F6"/>
    <circle cx="0" cy="0" r="7" fill="#A3B18A"/>
    <line x1="0" y1="0" x2="-25" y2="-60" stroke="#FAF9F6" stroke-width="2"/>
    <circle cx="-25" cy="-60" r="4" fill="#DCD2E9"/>
    <line x1="0" y1="0" x2="25" y2="-60" stroke="#FAF9F6" stroke-width="2"/>
    <circle cx="25" cy="-60" r="4" fill="#DCD2E9"/>
    <line x1="0" y1="0" x2="0" y2="-75" stroke="#FAF9F6" stroke-width="2"/>
    <circle cx="0" cy="-75" r="5" fill="#A3B18A"/>
  </g>

  <!-- Interactive MediaPipe Hand Landmarks Wireframe Skeleton -->
  <g transform="translate(560, 150)">
    <!-- Wrist -->
    <circle cx="80" cy="220" r="6" fill="#A3B18A"/>
    
    <!-- Thumb -->
    <line x1="80" y1="220" x2="50" y2="180" stroke="#A3B18A" stroke-width="1.8"/>
    <circle cx="50" cy="180" r="5" fill="#A3B18A"/>
    <line x1="50" y1="180" x2="35" y2="150" stroke="#A3B18A" stroke-width="1.8"/>
    <circle cx="35" cy="150" r="5" fill="#A3B18A"/>
    
    <!-- Index Finger (Interacting pointer reaching toward the lily) -->
    <line x1="80" y1="220" x2="80" y2="150" stroke="#A3B18A" stroke-width="1.8"/>
    <circle cx="80" cy="150" r="5" fill="#A3B18A"/>
    <line x1="80" y1="150" x2="70" y2="90" stroke="#DCD2E9" stroke-width="2"/>
    <circle cx="70" cy="90" r="6" fill="#DCD2E9"/>
    <line x1="70" y1="90" x2="-40" y2="60" stroke="#FAF9F6" stroke-width="2.5" stroke-dasharray="4,4"/>
    <circle cx="-40" cy="60" r="9" fill="#FAF9F6" stroke="#A3B18A" stroke-width="3"/>
    
    <!-- Middle, Ring, Pinky -->
    <line x1="80" y1="220" x2="110" y2="160" stroke="#A3B18A" stroke-width="1.5"/>
    <circle cx="110" cy="160" r="4.5" fill="#A3B18A"/>
    <line x1="110" y1="160" x2="115" y2="110" stroke="#A3B18A" stroke-width="1.5"/>
    <circle cx="115" cy="110" r="4.5" fill="#A3B18A"/>

    <line x1="80" y1="220" x2="135" y2="175" stroke="#A3B18A" stroke-width="1.5"/>
    <circle cx="135" cy="175" r="4.5" fill="#A3B18A"/>

    <line x1="80" y1="220" x2="155" y2="195" stroke="#A3B18A" stroke-width="1.5"/>
    <circle cx="155" cy="195" r="4" fill="#A3B18A"/>

    <rect x="-100" y="10" width="120" height="26" rx="6" fill="#252B27" stroke="#FAF9F6" stroke-width="1"/>
    <text x="-40" y="27" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FAF9F6" text-anchor="middle">INDEX (x,y,z)</text>
  </g>

  <!-- Labels -->
  <g transform="translate(60, 60)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#FAF9F6">Glowing Lily</text>
    <text x="0" y="26" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#DCD2E9">INTERACTIVE HAND-TRACKING EXPERIENCE</text>
  </g>

  <g transform="translate(60, 420)">
    <text x="0" y="0" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#A3B18A">PYTHON • OPENCV • MEDIAPIPE • PYGAME</text>
    <text x="0" y="20" font-family="'DM Sans', sans-serif" font-size="12" font-weight="400" fill="#85877F">Real-time landmark tracking &amp; dynamic bloom kinetics</text>
  </g>
</svg>