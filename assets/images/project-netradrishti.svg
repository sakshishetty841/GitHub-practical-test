<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="ndBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2420"/>
      <stop offset="100%" stop-color="#2D3630"/>
    </linearGradient>
    <radialGradient id="retinaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A3B18A" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#588157" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1E2420" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sageLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A3B18A" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#A3B18A"/>
      <stop offset="100%" stop-color="#DCD2E9" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#ndBg)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#FAF9F6" stroke-width="0.5" stroke-opacity="0.08">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Big Stylized Retinal Scan Centerpiece -->
  <circle cx="400" cy="240" r="160" fill="url(#retinaGlow)"/>
  <circle cx="400" cy="240" r="140" fill="none" stroke="#A3B18A" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,4"/>
  <circle cx="400" cy="240" r="100" fill="none" stroke="#DCD2E9" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="400" cy="240" r="50" fill="none" stroke="#A3B18A" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Retinal Vascular Pattern (stylized branch lines) -->
  <path d="M 400 240 Q 430 200, 470 170 T 520 150" fill="none" stroke="#A3B18A" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M 400 240 Q 370 200, 310 180 T 260 160" fill="none" stroke="#A3B18A" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M 400 240 Q 420 280, 460 310 T 500 330" fill="none" stroke="#DCD2E9" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M 400 240 Q 360 270, 320 310 T 280 340" fill="none" stroke="#A3B18A" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- AI Detection Bounding Boxes & Confidence Overlays -->
  <rect x="440" y="160" width="70" height="50" rx="6" fill="none" stroke="#A3B18A" stroke-width="2"/>
  <text x="446" y="152" font-family="'DM Sans', monospace" font-size="10" font-weight="700" fill="#A3B18A">LESION 94.8%</text>

  <rect x="290" y="270" width="60" height="46" rx="6" fill="none" stroke="#DCD2E9" stroke-width="1.5"/>
  <text x="294" y="262" font-family="'DM Sans', monospace" font-size="10" font-weight="700" fill="#DCD2E9">EXUDATE</text>

  <!-- Reticle Corners -->
  <path d="M 230 110 L 210 110 L 210 130" fill="none" stroke="#A3B18A" stroke-width="3"/>
  <path d="M 570 110 L 590 110 L 590 130" fill="none" stroke="#A3B18A" stroke-width="3"/>
  <path d="M 210 350 L 210 370 L 230 370" fill="none" stroke="#A3B18A" stroke-width="3"/>
  <path d="M 590 350 L 590 370 L 570 370" fill="none" stroke="#A3B18A" stroke-width="3"/>

  <!-- Smart India Hackathon Badge Top Right -->
  <g transform="translate(560, 36)">
    <rect width="200" height="34" rx="17" fill="#FAF9F6" fill-opacity="0.1"/>
    <circle cx="20" cy="17" r="5" fill="#A3B18A"/>
    <text x="34" y="22" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#FAF9F6">SIH Finalist • 4th Place</text>
  </g>

  <!-- Left Header Overlays -->
  <text x="50" y="60" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#FAF9F6">NetraDrishti</text>
  <text x="50" y="85" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#A3B18A">EXPLAINABLE AI • DIABETIC RETINOPATHY TRIAGE</text>

  <!-- Role Pillars Pills Bottom -->
  <g transform="translate(50, 410)">
    <rect width="130" height="32" rx="16" fill="#FAF9F6" fill-opacity="0.1" stroke="#A3B18A" stroke-width="1"/>
    <text x="65" y="21" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#FAF9F6" text-anchor="middle">ASHA Worker</text>
  </g>
  <g transform="translate(190, 410)">
    <rect width="130" height="32" rx="16" fill="#FAF9F6" fill-opacity="0.1" stroke="#A3B18A" stroke-width="1"/>
    <text x="65" y="21" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#FAF9F6" text-anchor="middle">Doctor Portal</text>
  </g>
  <g transform="translate(330, 410)">
    <rect width="130" height="32" rx="16" fill="#FAF9F6" fill-opacity="0.1" stroke="#DCD2E9" stroke-width="1"/>
    <text x="65" y="21" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#DCD2E9" text-anchor="middle">AI Triage Service</text>
  </g>
</svg>