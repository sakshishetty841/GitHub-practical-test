<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="cityBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#212623"/>
      <stop offset="100%" stop-color="#2D352F"/>
    </linearGradient>
    <linearGradient id="heatFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A3B18A"/>
      <stop offset="50%" stop-color="#DCD2E9"/>
      <stop offset="100%" stop-color="#A3B18A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#cityBg)"/>

  <!-- Perspective Computational Road Grid -->
  <g stroke="#FAF9F6" stroke-width="1" stroke-opacity="0.12">
    <!-- Isometric Grid Lines -->
    <line x1="80" y1="360" x2="720" y2="360"/>
    <line x1="120" y1="280" x2="680" y2="280"/>
    <line x1="160" y1="200" x2="640" y2="200"/>
    <line x1="200" y1="130" x2="600" y2="130"/>

    <line x1="120" y1="440" x2="260" y2="100"/>
    <line x1="280" y1="440" x2="350" y2="100"/>
    <line x1="400" y1="440" x2="400" y2="100"/>
    <line x1="520" y1="440" x2="450" y2="100"/>
    <line x1="680" y1="440" x2="540" y2="100"/>
  </g>

  <!-- Flow Streamlines / Particle Vectors -->
  <path d="M 120 400 Q 280 340, 400 320 T 680 260" fill="none" stroke="url(#heatFlow)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 280 440 Q 360 260, 400 200 T 540 120" fill="none" stroke="#A3B18A" stroke-width="3" stroke-dasharray="8,6"/>
  <path d="M 640 400 Q 500 320, 400 280 T 160 220" fill="none" stroke="#DCD2E9" stroke-width="2.5" stroke-dasharray="10,6"/>

  <!-- Intersection Hotspots -->
  <circle cx="400" cy="280" r="32" fill="#A3B18A" fill-opacity="0.2"/>
  <circle cx="400" cy="280" r="16" fill="#A3B18A" fill-opacity="0.5"/>
  <circle cx="400" cy="280" r="6" fill="#FAF9F6"/>

  <circle cx="280" cy="340" r="24" fill="#DCD2E9" fill-opacity="0.25"/>
  <circle cx="280" cy="340" r="5" fill="#DCD2E9"/>

  <circle cx="520" cy="280" r="22" fill="#A3B18A" fill-opacity="0.25"/>
  <circle cx="520" cy="280" r="5" fill="#A3B18A"/>

  <!-- Floating Data Metric Cards -->
  <g transform="translate(60, 60)">
    <rect width="210" height="74" rx="12" fill="#252B27" fill-opacity="0.85" stroke="#A3B18A" stroke-width="1.5"/>
    <text x="16" y="28" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#A3B18A" letter-spacing="1">VELOCITY DENSITY VECTOR</text>
    <text x="16" y="54" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#FAF9F6">ρ(x, t) = 0.742</text>
  </g>

  <g transform="translate(540, 60)">
    <rect width="200" height="74" rx="12" fill="#252B27" fill-opacity="0.85" stroke="#DCD2E9" stroke-width="1.5"/>
    <text x="16" y="28" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#DCD2E9" letter-spacing="1">NUMPY SIMULATION</text>
    <text x="16" y="54" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#FAF9F6">10,000 Agents</text>
  </g>

  <!-- Title & Status -->
  <g transform="translate(60, 420)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#FAF9F6">Smart City Traffic Flow Simulator</text>
    <text x="0" y="22" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#85877F">COMPUTATIONAL MODELLING • PYTHON • NUMPY • PANDAS</text>
  </g>

  <g transform="translate(600, 412)">
    <rect width="140" height="28" rx="14" fill="#FAF9F6" fill-opacity="0.1" stroke="#A3B18A" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#A3B18A"/>
    <text x="28" y="18" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#FAF9F6">In Development</text>
  </g>
</svg>