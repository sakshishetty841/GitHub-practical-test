<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#F2EBDD"/>
  <!-- Ball of Yarn and Crochet Hook -->
  <g transform="translate(45, 45)">
    <!-- Yarn Ball -->
    <circle cx="55" cy="55" r="42" fill="#DCD2E9"/>
    
    <!-- Yarn Strands / Texture Loops -->
    <path d="M 25 40 C 45 20, 75 30, 85 50" fill="none" stroke="#FAF9F6" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20 60 C 40 85, 70 85, 90 65" fill="none" stroke="#FAF9F6" stroke-width="3" stroke-linecap="round"/>
    <path d="M 35 25 C 60 50, 60 75, 45 95" fill="none" stroke="#FAF9F6" stroke-width="3" stroke-linecap="round"/>
    <path d="M 65 20 C 50 45, 60 85, 75 92" fill="none" stroke="#FAF9F6" stroke-width="3" stroke-linecap="round"/>

    <!-- Trailing Yarn Thread -->
    <path d="M 85 80 C 100 110, 30 115, 20 125 C 10 135, 40 140, 50 135" fill="none" stroke="#A3B18A" stroke-width="3" stroke-linecap="round"/>

    <!-- Crochet Hook crossing through -->
    <g transform="rotate(42 55 55)">
      <line x1="-15" y1="55" x2="125" y2="55" stroke="#252B27" stroke-width="4" stroke-linecap="round"/>
      <!-- Hook tip -->
      <path d="M 125 55 C 130 55, 134 50, 130 46 C 126 42, 120 48, 122 52" fill="none" stroke="#252B27" stroke-width="3"/>
    </g>
  </g>
</svg>