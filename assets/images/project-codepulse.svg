<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="codeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2320"/>
      <stop offset="100%" stop-color="#28302A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#codeBg)"/>

  <!-- Code / Memory Block Diagram -->
  <g transform="translate(80, 110)">
    <!-- Memory layout blocks -->
    <rect x="0" y="0" width="640" height="90" rx="12" fill="#252B27" stroke="#85877F" stroke-width="1"/>
    <text x="24" y="26" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#A3B18A">NUMERICAL DTYPES &amp; BUFFER OCCUPANCY</text>
    
    <!-- Data blocks -->
    <rect x="24" y="38" width="90" height="36" rx="6" fill="#A3B18A" fill-opacity="0.3" stroke="#A3B18A" stroke-width="1.5"/>
    <text x="69" y="61" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FAF9F6" text-anchor="middle">int8: 1B</text>

    <rect x="124" y="38" width="110" height="36" rx="6" fill="#A3B18A" fill-opacity="0.5" stroke="#A3B18A" stroke-width="1.5"/>
    <text x="179" y="61" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FAF9F6" text-anchor="middle">int32: 4B</text>

    <rect x="244" y="38" width="150" height="36" rx="6" fill="#DCD2E9" fill-opacity="0.5" stroke="#DCD2E9" stroke-width="1.5"/>
    <text x="319" y="61" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FAF9F6" text-anchor="middle">float64: 8B</text>

    <rect x="404" y="38" width="210" height="36" rx="6" fill="#FAF9F6" fill-opacity="0.1" stroke="#FAF9F6" stroke-width="1"/>
    <text x="509" y="61" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#FAF9F6" text-anchor="middle">Vectorized Stride</text>
  </g>

  <!-- Benchmark Comparison Graph -->
  <g transform="translate(80, 230)">
    <!-- Graph Axis -->
    <line x1="40" y1="130" x2="640" y2="130" stroke="#85877F" stroke-width="1"/>
    <line x1="40" y1="130" x2="40" y2="10" stroke="#85877F" stroke-width="1"/>

    <!-- Bar 1: Pure Python Loop -->
    <rect x="100" y="25" width="80" height="105" rx="6" fill="#85877F" fill-opacity="0.4"/>
    <text x="140" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FAF9F6" text-anchor="middle">182.4ms</text>
    <text x="140" y="150" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#FAF9F6" text-anchor="middle">Python Loop</text>

    <!-- Bar 2: List Comp -->
    <rect x="230" y="55" width="80" height="75" rx="6" fill="#DCD2E9" fill-opacity="0.6"/>
    <text x="270" y="48" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FAF9F6" text-anchor="middle">108.1ms</text>
    <text x="270" y="150" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#FAF9F6" text-anchor="middle">List Comp</text>

    <!-- Bar 3: NumPy Vectorized (Ultra Fast) -->
    <rect x="360" y="118" width="80" height="12" rx="4" fill="#A3B18A"/>
    <text x="400" y="110" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#A3B18A" text-anchor="middle">1.2ms (152x)</text>
    <text x="400" y="150" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#A3B18A" text-anchor="middle">NumPy Vector</text>

    <!-- Speedup Highlight Card -->
    <g transform="translate(480, 20)">
      <rect width="160" height="85" rx="10" fill="#252B27" stroke="#A3B18A" stroke-width="1.5"/>
      <text x="80" y="32" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#A3B18A" text-anchor="middle">MAX PEAK SPEEDUP</text>
      <text x="80" y="62" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#FAF9F6" text-anchor="middle">152x</text>
    </g>
  </g>

  <!-- Titles -->
  <g transform="translate(80, 50)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="700" fill="#FAF9F6">CodePulse Performance Lab</text>
    <text x="0" y="24" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#A3B18A">PYTHON • NUMPY MEMORY ARCHITECTURE &amp; BENCHMARKING</text>
  </g>
</svg>